<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Select Clothes — Updated Layout</title>

<!-- fitting.css 연결 -->
<link rel="stylesheet" href="/static/css/fitting.css">

</head>

<body class="page-select">

<button class="tryon-btn" id="tryonBtn">착용하기</button>

<div class="top-photo-area"></div>

<div class="clothes-row">
    <div class="row-title">상의</div>
    <div class="horizontal-scroll" id="tops-row">
        {% for top_img in tops %}
        <img src="/static/{{ top_img.split('static/')[-1] }}" class="clothes-img" data-type="top" data-name="{{ loop.index }}">
        {% endfor %}
    </div>
</div>

<div class="clothes-row">
    <div class="row-title">하의</div>
    <div class="horizontal-scroll" id="bottoms-row">
        {% for bottom_img in bottoms %}
        <img src="/static/{{ bottom_img.split('static/')[-1] }}" class="clothes-img" data-type="bottom" data-name="{{ loop.index }}">
        {% endfor %}
    </div>
</div>

<!-- fitting.js 연결 -->
<script src="/static/js/fitting.js"></script>

</body>
</html>
