<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로딩 중...</title>
<style>
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Noto Sans KR", sans-serif;
}
.loading-text {
    font-size: 32px;
    font-weight: 600;
    text-align: center;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    margin-bottom: 40px;
}
.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top: 4px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="loading-text">당신의 스타일을 완성중이에요!</div>
<div class="spinner"></div>

<script>
// URL 파라미터에서 옷 정보 가져오기
const urlParams = new URLSearchParams(window.location.search);
const top = urlParams.get('top');
const bottom = urlParams.get('bottom');
const mode = urlParams.get('mode');

async function processTryon() {
    try {
        // 바로 tryon 호출
        const tryonRes = await fetch("/tryon", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ top, bottom, mode })
        });

        const tryonData = await tryonRes.json();

        if (tryonData.error) {
            alert(tryonData.error);
            window.location.href = "/select";
            return;
        }

        if (tryonData.result) {
            window.location.href = `/result?image=${encodeURIComponent(tryonData.result)}`;
        } else {
            alert("합성에 실패했습니다.");
            window.location.href = "/select";
        }

    } catch (e) {
        console.error("처리 실패:", e);
        alert("처리 중 오류가 발생했습니다.");
        window.location.href = "/select";
    }
}

window.addEventListener("DOMContentLoaded", processTryon);
</script>
</body>
</html>
