<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Result Page</title>

<style>
    /* 폰트 (Pretendard) */
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

    /* 기본 및 바디 스타일 */
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #f9f9f9;
        font-family: "Pretendard", sans-serif;
        box-sizing: border-box;
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    /* 오로라 그라데이션 */
    .aurora {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(circle at 50% 25%,
            rgba(150, 255, 230, 0.45),
            rgba(120, 180, 255, 0.4),
            rgba(200, 160, 255, 0.45),
            transparent 70%
        );
        filter: blur(80px);
        animation: auroraMove 18s ease-in-out infinite;
        opacity: 0.5;
    }

    @keyframes auroraMove {
        0% { transform: translate(-12%, -18%) scale(1.15) rotate(0deg); }
        15% { transform: translate(10%, -5%) scale(1.25) rotate(40deg); }
        30% { transform: translate(-8%, 15%) scale(1.22) rotate(120deg); }
        50% { transform: translate(14%, -10%) scale(1.32) rotate(200deg); }
        70% { transform: translate(-5%, 25%) scale(1.28) rotate(260deg); }
        85% { transform: translate(8%, -12%) scale(1.20) rotate(320deg); }
        100% { transform: translate(-12%, -18%) scale(1.15) rotate(360deg); }
    }

    /* 전체 콘텐츠 래퍼 */
    .content-wrapper {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 5vh 5vw 0 5vw;
    }

    /* 결과 사진 프레임 */
    .photo-frame {
        height: 72vh;
        width: 100%;
        background: #ffffff;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.07);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 플레이스홀더 */
    .placeholder-text {
        font-size: 24px;
        font-weight: 300;
        color: #ccc;
    }

    /* 버튼 컨테이너 */
    .button-container {
        height: 23vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
    }

    /* 버튼 공통 */
    .btn {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        min-width: 160px;
        text-align: center;
        border-radius: 14px;
        font-family: "Pretendard", sans-serif;
    }

    /* 다시 입어보기 */
    .btn-retry {
        background: transparent;
        border: 1.5px solid rgba(0, 0, 0, 0.25);
        color: #333;
    }
    .btn-retry:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    /* 종료 */
    .btn-exit {
        background: #222;
        color: #ffffff;
        border: 1.5px solid #222;
    }
    .btn-exit:hover {
        background: #444;
        border-color: #444;
    }
</style>

</head>
<body>

    <div class="aurora"></div>
    
    <div class="content-wrapper">
        
        <!-- ⬇⬇ 결과 이미지 표시 부분 (app.py와 완전 매칭) ⬇⬇ -->
        <div class="photo-frame">
            {% if result_image %}
            <img 
                src="{{ result_image }}" 
                alt="결과 이미지"
                style="max-width: 100%; max-height: 100%; object-fit: contain;">
            {% else %}
            <span class="placeholder-text">[ 결과 사진 영역 ]</span>
            {% endif %}
        </div>
        <!-- ⬆⬆ 여기만 정확히 고쳐주면 100% 정상작동 ⬆⬆ -->
        
        <div class="button-container">
            <button class="btn btn-retry" onclick="window.location.href='/select'">
                다시 입어보기
            </button>
            <button class="btn btn-exit" onclick="window.location.href='/'">
                종료
            </button>
        </div>

    </div>

</body>
</html>
