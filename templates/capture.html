{% extends "base.html" %}

{% block title %}Capture{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/capture.css') }}">
{% endblock %}

{% block content %}
<div class="screen-on"></div>

<div class="preview">
    <video id="camera" autoplay playsinline muted></video>

    <div class="voice-guide">준비되시면 촬영 해주세요</div>

    <div id="message" class="msg">카메라 권한을 허용해주세요.</div>

    <div class="countdown-timer" id="countdownTimer">
        <svg class="timer-svg" viewBox="0 0 100 100">
            <circle class="timer-track" cx="50" cy="50" r="45"></circle>
            <circle class="timer-progress" cx="50" cy="50" r="45"></circle>
        </svg>
    </div>

    <div class="controls">
        <button class="shutter" id="shutterBtn" aria-label="촬영"></button>
    </div>
</div>

<canvas id="snapshot"></canvas>
{% endblock %}

{% block body_extra %}
    <script src="{{ url_for('static', filename='js/capture.js') }}"></script>
{% endblock %}
